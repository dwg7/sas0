<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>状況認識サービス0（sas0）</title>
    <link rel="stylesheet" href="https://unpkg.com/openmct@4.3.0-rc1/dist/espressoTheme.css" />
    <!-- MapLibre GL JS pinned to the latest v5 release, not the newer v6:
         v6 dropped the plain-<script>/window.maplibregl UMD bundle in favor
         of ES modules only (verified: unpkg.com/maplibre-gl@6.6.0/dist/
         maplibre-gl.js 404s), and v5.24.0 still ships it — keeping every
         instrument's script-tag loading pattern consistent. See D2's
         checklist / DECISIONS.md D27. -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <script>
      // Open MCT's built-in search indexer starts a SharedWorker from the
      // script's own origin. Since Open MCT is loaded from a CDN here, that
      // worker load is cross-origin and browsers block it. Disabling
      // SharedWorker makes Open MCT fall back to its synchronous in-page
      // search implementation instead.
      window.SharedWorker = undefined;
    </script>
    <script src="https://unpkg.com/openmct@4.3.0-rc1/dist/openmct.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <div id="app"></div>
    <script src="./core.js"></script>
    <script src="./config.js"></script>
    <script src="./folders.js"></script>
    <script src="./instruments/weather.js"></script>
    <script src="./instruments/hkd-map.js"></script>
    <script src="./instruments/warnings.js"></script>
    <script src="./instruments/quake.js"></script>
    <script src="./instruments/volcano.js"></script>
    <script src="./instruments/gsi-hazard.js"></script>
    <script src="./instruments/hokkaido.js"></script>
    <script src="./instruments/hokkaido-safe-travel.js"></script>
    <script src="./instruments/hokkaido-development-bureau.js"></script>
    <script src="./instruments/kmoni.js"></script>
    <script src="./instruments/river-info.js"></script>
    <script src="./instruments/municipalities.js"></script>
    <script src="./instruments/volcano-councils.js"></script>
    <script src="./boot.js"></script>
  </body>
</html>
